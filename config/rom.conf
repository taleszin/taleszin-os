# Configuração da ROM (shell). Qualquer variável pode ser sobrescrita pelo ambiente:
#   ANIM_SCALE=0.5 LOW_RAM=false scripts/build.sh firmware.zip
# Padrão = "o mais capado possível" em desempenho (decisão do dono, 13/11/2026).

ROM_NAME=${ROM_NAME:-Taleszin OS}             # nome da ROM (Sobre o tablet, Diagnóstico, tela inicial)
ROM_VERSION=${ROM_VERSION:-1.4.1}
# Data fixa de todos os timestamps do FS (reprodutibilidade). 2026-11-14 00:00 UTC.
SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH:-1794614400}

# ---------- build.prop (lidos no boot; mudar exige rebuild + regravar system) ----------
# ro.config.low_ram=true: sem translucidez da barra de status/navegação, SystemUI/teclado/papel de
# parede sem aceleração de GPU, 1 serviço iniciando por vez, menos tarefas recentes. Ver README.
LOW_RAM=${LOW_RAM:-true}
DALVIK_HEAPSIZE=${DALVIK_HEAPSIZE:-128m}      # teto para apps largeHeap (estoque: 256m)
DALVIK_GROWTHLIMIT=${DALVIK_GROWTHLIMIT:-48m} # teto normal por app (estoque: 48m, mantido)
NO_BOOTANIM=${NO_BOOTANIM:-1}                 # debug.sf.nobootanimation (BOOTANIM=1 força 0)
TIMEZONE=${TIMEZONE:-America/Fortaleza}       # persist.sys.timezone (estoque: America/Sao_Paulo)
TZDATA_UPDATE=${TZDATA_UPDATE:-1}             # 1 = troca o tzdata 2013h pelo IANA atual; 0 = mantém o de fábrica
USB_CONFIG=${USB_CONFIG:-mtp,adb}             # estoque: mass_storage,adb (rouba o /sdcard do Android)
BRIGHTNESS=${BRIGHTNESS:-102}                 # ro.rk.def_brightness, 0-255 (estoque: 200)
SCREEN_OFF_MS=${SCREEN_OFF_MS:-60000}         # ro.rk.screenoff_time
INSTALL_NON_MARKET=${INSTALL_NON_MARKET:-true} # ro.rk.install_non_market_apps (F-Droid precisa)
LOCKSCREEN_DISABLED=${LOCKSCREEN_DISABLED:-1} # ro.lockscreen.disable.default + secure lockscreen.disabled

# ---------- Settings aplicados uma vez no 1º boot (m7s-firstboot) ----------
ANIM_SCALE=${ANIM_SCALE:-0}                   # 0 = sem animação; 0.5 = metade; 1 = estoque
HAPTIC=${HAPTIC:-0}
TOUCH_SOUNDS=${TOUCH_SOUNDS:-0}
LOCKSCREEN_SOUNDS=${LOCKSCREEN_SOUNDS:-0}
WIFI_SLEEP_POLICY=${WIFI_SLEEP_POLICY:-1}     # 0=desliga c/ tela apagada, 1=só mantém na tomada, 2=nunca desliga (estoque)
WIFI_SCAN_INTERVAL_MS=${WIFI_SCAN_INTERVAL_MS:-60000} # busca de rede desconectado (estoque 15000)
WIFI_SCAN_ALWAYS=${WIFI_SCAN_ALWAYS:-0}
IME=${IME:-rkr.simplekeyboard.inputmethod/.latin.LatinIME}

# ---------- boot hook (install-recovery.sh, a cada boot) ----------
ZRAM_MB=${ZRAM_MB:-128}
KSM=${KSM:-1}
IOSCHED=${IOSCHED:-deadline}
CPU_MAX_KHZ=${CPU_MAX_KHZ:-1008000}           # 912000 corta o degrau mais caro
HISPEED_KHZ=${HISPEED_KHZ:-816000}            # frequência do boost de toque (boostpulse do power HAL)
GO_HISPEED_LOAD=${GO_HISPEED_LOAD:-85}
TARGET_LOADS=${TARGET_LOADS:-"85 1008000:95"}
MIN_SAMPLE_US=${MIN_SAMPLE_US:-40000}
TELEMETRY=${TELEMETRY:-1}
# Guarda de bateria (m7s-powerguard): bateria de 2014 gasta, gauge por tensão mente e a tensão
# despenca sob carga (telemetria 13–14/11: desligamentos súbitos a 3,66 V e 3,38 V com Firefox).
POWERGUARD=${POWERGUARD:-1}
PG_CUTOFF_MV=${PG_CUTOFF_MV:-3480}            # desliga limpo abaixo disto (fora da tomada)
PG_CONFIRM=${PG_CONFIRM:-2}                   # leituras seguidas abaixo do corte
PG_CONFIRM_S=${PG_CONFIRM_S:-5}               # intervalo entre leituras de confirmação
PG_INTERVAL=${PG_INTERVAL:-25}                # amostragem normal (s)
PG_GRACE_S=${PG_GRACE_S:-120}                 # ignora os primeiros N s de uptime (boot)
PG_BATT_MAX_KHZ=${PG_BATT_MAX_KHZ:-816000}    # teto de CPU na bateria; na tomada vale CPU_MAX_KHZ

# ---------- apps próprios (fonte local, sha256 fixo em config/apks.txt) ----------
# Prancheta do Taleszin (app.mamba.prancheta): APK gerado no repo mamba-prancheta, não baixado.
PRANCHETA_APK=${PRANCHETA_APK:-$HOME/dev/mamba-prancheta/build/prancheta-mamba.apk}
PRANCHETA=${PRANCHETA:-1}                     # 0 = não embute
# Tela inicial: taleszin = Taleszin Home (~/dev/taleszin-home; o KISS fica instalado porém desativado) | kiss
HOME_LAUNCHER=${HOME_LAUNCHER:-taleszin}
# Módulo Xposed m7s-tema (~/dev/m7s-tema): troca o azul Holo pelo laranja #FF7A1A em todos os apps (só com XPOSED=1)
TEMA=${TEMA:-1}
# App Diagnóstico (~/dev/m7s-diagnostico): estilo CPU-Z, didático; lê /data/m7s-telemetry
DIAGNOSTICO=${DIAGNOSTICO:-1}
DIAGNOSTICO_APK=${DIAGNOSTICO_APK:-$HOME/dev/m7s-diagnostico/build/diagnostico.apk}
TEMA_APK=${TEMA_APK:-$HOME/dev/m7s-tema/build/m7s-tema.apk}
TALESZIN_HOME_APK=${TALESZIN_HOME_APK:-$HOME/dev/taleszin-home/build/taleszin-home.apk}
# Apps FOSS leves (F-Droid, escolha justificada em docs/README.md): arquivos, PDF/EPUB, notas. 0 = não embute.
EXTRA_APPS=${EXTRA_APPS:-1}
# Navegador principal: Bromite 81 (Chromium, open source, bloqueia anúncios). Firefox 68 saiu na v1.4 (FIREFOX=1 traz de volta).
BROMITE=${BROMITE:-1}
FIREFOX=${FIREFOX:-0}
# 8 jogos leves (quebra-cabeças, 2048, Frozen Bubble, Sudoku, Paciência, Xadrez, Blockinger, Klooni) ~36 MB em /data
JOGOS=${JOGOS:-1}

# ---------- visual (v1.1 "remodernizado") — custo de cada item em docs/VISUAL.md ----------
# Fontes: roboto3 = Roboto 3 (googlefonts/roboto-3-classic, OFL) com as mesmas métricas verticais
#         do Roboto de 2014; googlesans = Google Sans Flex em instâncias estáticas (experimental,
#         precisa do fontTools baixado pelo build); stock = não mexe.
FONTS=${FONTS:-roboto3}
# Papel de parede escuro gerado no build (PNG próprio) no lugar do padrão de fábrica da Rockchip
# (/system/media/rkfactory/default_wallpaper.jpg). Quadrado = o tamanho que o 4.4 pede numa tela
# 800x480 (max(l,a) nos dois lados), então entra sem reescala; 0 = mantém o de fábrica.
WALLPAPER=${WALLPAPER:-1}
WALLPAPER_SIZE=${WALLPAPER_SIZE:-800x800}
# KISS: tema e pacote de ícones (Ameixa = ícones Material, já pré-instalado). Vazio = não mexe.
KISS_THEME=${KISS_THEME:-transparent-dark}    # light|semi-transparent|transparent|dark|semi-transparent-dark|transparent-dark|amoled-dark
ICON_PACK=${ICON_PACK:-org.xphnx.ameixa}      # "default" = ícones do sistema
DARK_APPS=${DARK_APPS:-1}                     # Simple Keyboard e F-Droid no tema escuro
# Bootanimation curta no estilo Material (spinner 160x160, 20 fps). OFF: boot mais rápido.
BOOTANIM=${BOOTANIM:-1}                       # animação de boot da Taleszin OS (bola laranja + arco); ~0 s a mais, roda enquanto o sistema carrega
# Xposed 2.7 experimental1 (app_process v58 + XposedBridge 54) + GravityBox [KK] 3.6.2.
# OFF por padrão: não testado no aparelho e custa RAM em todo processo (ver docs/VISUAL.md).
XPOSED=${XPOSED:-1}
XPOSED_REBOOT=${XPOSED_REBOOT:-1}             # 1 = o 1º boot reinicia sozinho uma vez para ativar
GB_BATTERY_STYLE=${GB_BATTERY_STYLE:-1}       # 1 estoque, 2 círculo, 3 círculo+%, 4 KitKat, 5 KitKat+%, 0 nenhum
GB_CENTER_CLOCK=${GB_CENTER_CLOCK:-1}
GB_FLAT_ICONS=${GB_FLAT_ICONS:-1}             # ícones de sinal/Wi-Fi do Lollipop (planos)
GB_MODERN=${GB_MODERN:-1}                    # navbar Lollipop, bateria %, heads-up, limpar recentes + RAM, brilho na barra
